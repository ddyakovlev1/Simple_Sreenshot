name: Сборка

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'SimpleScreenshot.csproj'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать exe
        run: dotnet build SimpleScreenshot.csproj -c Release -o out

      - name: Сохранить exe как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: SimpleScreenshot
          path: out/SimpleScreenshot.exe

      - name: Обновить релиз «latest»
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest out/SimpleScreenshot.exe \
            --title "Simple Screenshot — последняя сборка" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачай SimpleScreenshot.exe ниже." \
            --target "$GITHUB_SHA"
